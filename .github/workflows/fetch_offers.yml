name: Fetch internship offers

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC: internship postings do not turn over faster

permissions:
  contents: write

concurrency:
  group: fetch-offers
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests
      # Several public job APIs, no key needed. The offers themselves stay in the
      # runner (gitignored); only the per-source counts are committed, so the
      # dashboard can show which sources are alive and how many offers each gave.
      - run: python scripts/fetch_offers.py
      - name: Commit source health
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/source_health.json
          git commit -m "Fetch latest offers [automated]" || echo "Nothing to commit"
          git pull --rebase
          git push
